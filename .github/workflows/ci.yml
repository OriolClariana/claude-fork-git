name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that claude is available
        run: |
          if ! command -v claude >/dev/null; then
            npm install -g @anthropic-ai/claude-code
          fi
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
